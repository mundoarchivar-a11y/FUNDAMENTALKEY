name: Macro Engine

on:
  schedule:
    # Cada 15 min, lun-vie, 06:00–22:00 UTC (cubre Londres + NY)
    - cron: '*/15 6-22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: macro-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: python macro_engine.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
